services:
  - type: web
    name: campussathi-ai-service
    runtime: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt && python -c "import chromadb.utils.embedding_functions as ef; ef.DefaultEmbeddingFunction()(['warmup'])"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GNANI_API_KEY
        sync: false
