apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: campussathi-ai
  labels:
    cloud.googleapis.com/location: asia-south1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: '0'
        autoscaling.knative.dev/maxScale: '5'
        run.googleapis.com/cpu-throttling: 'true'
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/campussathi-ai:latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: '1000m'
              memory: '2Gi'
          env:
            - name: HUGGINGFACE_API_KEY
              value: 'your_huggingface_token_here'
            - name: GNANI_API_KEY
              value: ''
